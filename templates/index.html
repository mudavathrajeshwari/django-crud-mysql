<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django with MySQL - CRUD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
    <div class="container mt-5">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active">Home</li>
            </ol>
        </nav>

        <div class="row mt-5">

            <!-- Add Customer -->
            <div class="col-md-5">
                <div class="card p-3">
                    <div class="card-body">

                        <h4>Add Customer</h4>
                        <hr>

                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Customer ID</label>
                                <input type="number"
                                       class="form-control form-control-sm"
                                       name="cid"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text"
                                       class="form-control form-control-sm"
                                       name="cname"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email"
                                       class="form-control form-control-sm"
                                       name="cemail"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text"
                                       class="form-control form-control-sm"
                                       name="ccity"
                                       required>
                            </div>

                            <input type="submit"
                                   value="Save Customer"
                                   class="btn btn-primary btn-sm">
                        </form>

                    </div>
                </div>
            </div>

            <!-- Customer List -->
            <div class="col-md-7">

                <table class="table table-bordered table-striped">

                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>City</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for customer in customers %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ customer.cid }}</td>
                            <td>{{ customer.cname }}</td>
                            <td>{{ customer.cemail }}</td>
                            <td>{{ customer.ccity }}</td>

                            <td>
                                <a href="{% url 'customer_edit' customer.cid %}"
                                   class="btn btn-warning btn-sm">
                                    Edit
                                </a>
                            </td>

                            <td>
                                <a href="{% url 'customer_delete' customer.cid %}"
                                   class="btn btn-danger btn-sm">
                                    Delete
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>

            </div>
        </div>
    </div>
</body>
</html>
